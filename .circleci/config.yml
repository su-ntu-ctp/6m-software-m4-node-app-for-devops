version: 2.1

orbs:
  node: circleci/node@5.0.1

# https://emmer.dev/blog/publishing-docker-images-with-circleci/

executors:
  docker-publisher:
    environment:
      IMAGE_TAG: recharging/m4-node-app-for-devops:latest
    docker:
      - image: docker:stable

jobs:
  build:
    docker:
      - image: cimg/node:16.10
    executor: docker-publisher
    steps:
      - checkout
      - setup_remote_docker
  #   - node/install-packages:
  #       pkg-manager: npm
  # - run: |
  #     echo "Installing dependencies..."
  #     npm install
      - run:
          name: Build Docker image
          command: docker build --tag m4-node-app-for-devops .
     
      - run:
          name: Archive Docker image
          command: docker save --output image.tar m4-node-app-for-devops
      - persist_to_workspace:
          root: .
          paths:
            - ./image.tar
  push:
    docker:
      - image: cimg/node:16.10
    executor: docker-publisher
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Load Docker image
          command: docker load --input /tmp/workspace/image.tar
      
      - run:
          name: Publish Docker image
          command: |
            docker login --username recharging
            docker push m4-node-app-for-devops

  # test:
  #   docker:
  #     - image: cimg/node:16.10
  #   steps:
  #     - checkout
  #     - node/install-packages:
  #         pkg-manager: npm
  #     - run:  |
  #         echo "Running tests..."
  #         npm run test


workflows:
  simple_workflow_plus_docker:
    jobs:
      - build
      # - test:
      #     requires:
      #       - build
      - push:
          requires:
            - build
          filters:
            branches:
              only: main